<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessaí - Acessibilidade para todos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Acessaí</h1>
        <p>Acessibilidade para todos</p>
    </header>

    <main>
        <section class="introducao">
            <h2>Seu destino, do seu jeito.</h2>
            <p>
                Encontre estabelecimentos considerando suas
                necessidades de acessibilidade.
            </p>
        </section>

        <section class="painel">
            <form id="formulario">

                <label for="perfil">Qual é o seu perfil?</label>
                <select id="perfil" required>
                    <option value="">Selecione uma opção</option>
                    <option value="cadeira-rodas">Pessoa que usa cadeira de rodas</option>
                    <option value="visual">Pessoa com deficiência visual</option>
                    <option value="auditiva">Pessoa com deficiência auditiva</option>
                    <option value="mobilidade">Pessoa com dificuldade de mobilidade</option>
                    <option value="outras">Outras necessidades</option>
                </select>

                <label for="categoria">Que tipo de lugar você procura?</label>
                <select id="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="todas">Todas as categorias</option>
                    <option value="restaurante">Restaurantes</option>
                    <option value="farmácia">Farmácias</option>
                    <option value="supermercado">Supermercados</option>
                    <option value="banco">Bancos</option>
                    <option value="shopping">Shoppings</option>
                </select>

                <button type="submit">Buscar locais</button>

            </form>
        </section>

        <!-- Aqui aparecem os resultados -->
        <p id="mensagem" role="status" aria-live="polite"></p>
        <section id="resultados"></section>
    </main>

    <footer>
        <p>Projeto Acessaí — Acessibilidade para todos.</p>
    </footer>

    <script>
        const formulario = document.getElementById("formulario");
        const mensagem = document.getElementById("mensagem");
        const resultados = document.getElementById("resultados");

        // Nomes bonitos para mostrar na tela
        const nomesDosPerfis = {
            "cadeira-rodas": "cadeira de rodas",
            "visual": "deficiência visual",
            "auditiva": "deficiência auditiva",
            "mobilidade": "mobilidade reduzida"
        };

        // Lê o arquivo locais.json e devolve a lista de locais
        async function carregarLocais() {
            const resposta = await fetch("locais.json");
            if (!resposta.ok) {
                throw new Error("Não foi possível ler o locais.json");
            }
            return await resposta.json();
        }

        // Fica só com os locais da categoria escolhida
        function filtrarPorCategoria(locais, categoria) {
            if (categoria === "todas") {
                return locais;
            }
            return locais.filter(function (local) {
                return local.categoria === categoria;
            });
        }

        // Monta o cartão (HTML) de um local
        function criarCartao(local, perfil) {
            const cartao = document.createElement("article");
            cartao.className = "cartao";

            const titulo = document.createElement("h3");
            titulo.textContent = local.nome;
            cartao.appendChild(titulo);

            const endereco = document.createElement("p");
            endereco.className = "endereco";
            endereco.textContent = local.endereco;
            cartao.appendChild(endereco);

            // Etiqueta dizendo se atende ao perfil escolhido
            const etiqueta = document.createElement("p");
            etiqueta.className = "etiqueta";

            if (perfil === "outras") {
                etiqueta.textContent = "Veja os recursos abaixo";
                etiqueta.classList.add("neutro");
            } else if (local.acessibilidade[perfil] === true) {
                etiqueta.textContent = "✔ Atende: " + nomesDosPerfis[perfil];
                etiqueta.classList.add("sim");
            } else {
                etiqueta.textContent = "✖ Não atende: " + nomesDosPerfis[perfil];
                etiqueta.classList.add("nao");
            }
            cartao.appendChild(etiqueta);

            // Lista de recursos (rampa, elevador...)
            const lista = document.createElement("ul");
            local.recursos.forEach(function (recurso) {
                const item = document.createElement("li");
                item.textContent = recurso;
                lista.appendChild(item);
            });
            cartao.appendChild(lista);

            return cartao;
        }

        formulario.addEventListener("submit", async function (event) {
            event.preventDefault();

            const perfil = document.getElementById("perfil").value;
            const categoria = document.getElementById("categoria").value;

            resultados.replaceChildren();
            mensagem.textContent = "Buscando...";

            try {
                const todos = await carregarLocais();
                const encontrados = filtrarPorCategoria(todos, categoria);

                if (encontrados.length === 0) {
                    mensagem.textContent = "Nenhum local cadastrado nessa categoria ainda.";
                    return;
                }

                mensagem.textContent = encontrados.length + " local(is) encontrado(s).";

                encontrados.forEach(function (local) {
                    resultados.appendChild(criarCartao(local, perfil));
                });

            } catch (erro) {
                console.error(erro);
                mensagem.textContent =
                    "Não foi possível carregar os locais. Abra o site com o Live Server.";
            }
        });
    </script>
</body>
</html>
